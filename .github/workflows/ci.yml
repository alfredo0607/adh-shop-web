name: CI

on:
  pull_request:
    branches: [main]
  # A push to main runs these checks through deploy.yml, which releases only
  # if they pass. Triggering here as well would run them twice per merge.
  workflow_call:

# Least privilege: this workflow only reads the repository.
permissions:
  contents: read

# A new push supersedes the previous run on the same branch. Without this, a
# series of quick pushes queues runs that are already obsolete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format, lint, types, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # --frozen-lockfile fails if package.json and the lockfile disagree, so a
      # dependency can never be added without its lockfile entry being reviewed.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # The 80% threshold the brief asks for lives in jest.config.js, so this
      # step fails on its own if coverage regresses. No second gate to keep in sync.
      - name: Test with coverage
        run: pnpm test:cov

      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            node -e "
              const t = require('./coverage/coverage-summary.json').total;
              const row = (k) => '| ' + k + ' | ' + t[k].pct + '% | ' + t[k].covered + ' / ' + t[k].total + ' |';
              console.log(['### Test coverage', '', '| Metric | Coverage | Covered |', '|---|---:|---:|',
                row('statements'), row('branches'), row('functions'), row('lines')].join('\n'));
            " >> "$GITHUB_STEP_SUMMARY"
          fi

      # A green test run proves nothing about whether the app bundles: this is
      # the build the release will ship.
      - name: Production build
        run: pnpm build

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high
